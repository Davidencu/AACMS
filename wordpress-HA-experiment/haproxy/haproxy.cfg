global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout connect 1s
    timeout client  60s
    timeout server  60s
    timeout http-request 10s
    retries 3
    option redispatch

# Docker's embedded DNS. Re-resolving "wordpress" lets HAProxy follow
# `docker compose up --scale wordpress=N` without a restart.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s
    hold other 5s
    hold nx 5s
    hold obsolete 5s

# Plain HTTP -> HTTPS redirect (published port 8080)
frontend http_in
    bind :8080
    http-request redirect location https://%[req.hdr(host),field(1,:)]:"${HTTPS_PORT}"%[url] code 301

# TLS termination + L7 load balancing (published port 8443)
frontend https_in
    bind :8443 ssl crt /certs/site.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port  "${HTTPS_PORT}"
    option forwardfor
    default_backend wordpress

backend wordpress
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz.php hdr Host localhost
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr none
    server-template wp 1-10 wordpress:80

# Stats page (published on 127.0.0.1:8404 only)
frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth "${STATS_USER}:${STATS_PASSWORD}"

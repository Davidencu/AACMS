services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drupal_user
      POSTGRES_PASSWORD: drupal_password
      POSTGRES_DB: drupal_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  drupal:
    image: drupal:latest
    ports:
      - "8080:80"
    environment:
      DRUPAL_DB_HOST: postgres
      DRUPAL_DB_PORT: 5432
      DRUPAL_DB_NAME: drupal_db
      DRUPAL_DB_USER: drupal_user
      DRUPAL_DB_PASSWORD: drupal_password
    depends_on:
      - postgres
    volumes:
      - drupal_data:/opt/drupal/web/sites
      - drupal_modules:/opt/drupal/web/modules
      - drupal_themes:/opt/drupal/web/themes
    restart: unless-stopped

volumes:
  postgres_data:
  drupal_data:
  drupal_modules:
  drupal_themes:

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout connect 1s
    timeout client  60s
    timeout server  60s
    timeout http-request 10s
    retries 3
    option redispatch

# Docker's embedded DNS, so HAProxy still starts and recovers when a node is down.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s
    hold other 5s
    hold nx 5s
    hold obsolete 5s

frontend http_in
    bind :8080
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    # Shows which node answered.
    http-response set-header X-Served-By %[srv_name]
    default_backend drupal

backend drupal
    balance roundrobin
    option httpchk
    # /user/login needs the database, so a node that lost its DB is taken out too.
    http-check send meth GET uri /user/login hdr Host localhost
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr none
    server drupal1 drupal1:80
    server drupal2 drupal2:80
    server drupal3 drupal3:80

# Stats page (published on 127.0.0.1:8404 only)
frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth "${STATS_USER}:${STATS_PASSWORD}"
